<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>一起审题｜理想型·加载中</title>
  <link rel="stylesheet" href="./question-review.css" />
</head>
<body>
  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>

  <header class="topbar">
    <div>
      <span class="kicker">理想型·加载中</span>
      <h1>一起审题</h1>
      <p>你判断，我记录。先选 Yes 或 No，再进入下一题。</p>
    </div>
    <div class="save-state" id="saveState" role="status">
      <i aria-hidden="true"></i><span>自动保存</span>
    </div>
  </header>

  <main class="review-shell">
    <section class="progress-block" aria-label="审题进度">
      <div class="progress-copy">
        <strong id="positionLabel">第 1 / 1467 题</strong>
        <span><b id="reviewedCount">0</b> 题已判断</span>
      </div>
      <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
    </section>

    <article class="question-card" id="questionCard">
      <div class="card-topline">
        <div class="meta-pills">
          <span id="moduleName">题库</span>
          <span id="deckName">档位</span>
        </div>
        <span class="decision-state pending" id="decisionState">未选择</span>
      </div>

      <div class="question-copy">
        <span class="question-prefix" id="questionPrefix">这是一个满分的 TA，但是——</span>
        <h2 id="questionText">题目加载中…</h2>
      </div>

      <label class="feedback-field" for="reviewNote">
        <span>你的评价 <small>可不填</small></span>
        <textarea id="reviewNote" rows="4" placeholder="哪里好、哪里不好，或者直接写你想怎么改"></textarea>
      </label>

      <p class="selection-hint" id="selectionHint" role="status">先选 Yes 或 No</p>

      <div class="action-bar" id="actionBar">
        <button class="choice-button yes" id="keepButton" type="button" aria-pressed="false">
          <strong>YES</strong><span>成立</span>
        </button>
        <button class="choice-button no" id="noButton" type="button" aria-pressed="false">
          <strong>NO</strong><span>不成立</span>
        </button>
        <button class="next-button" id="nextQuestion" type="button" disabled>
          <span>下一题</span><strong>→</strong>
        </button>
      </div>

      <div class="question-id" id="questionId">ID</div>
    </article>

    <section class="complete-card" id="completeCard" hidden>
      <span class="complete-icon">✓</span>
      <h2>这一组已经看完了</h2>
      <p>你的 Yes / No 和评价都保存在这台设备里。</p>
      <div class="complete-actions">
        <button class="primary-button" id="completeExport" type="button">把反馈发给我</button>
        <button class="secondary-button" id="reviewAgain" type="button">回到第一题</button>
      </div>
    </section>

    <details class="more-tools">
      <summary>换题库 / 导出反馈</summary>
      <div class="tools-body">
        <div class="tool-grid">
          <label><span>题库</span><select id="moduleFilter"></select></label>
          <label><span>题面</span>
            <select id="variantFilter">
              <option value="n">TA 版</option>
              <option value="m">男版</option>
              <option value="f">女版</option>
            </select>
          </label>
        </div>
        <div class="tools-actions">
          <button class="secondary-button" id="prevQuestion" type="button">← 返回上一题</button>
          <button class="primary-button" id="exportJson" type="button">把反馈发给我</button>
          <label class="secondary-button file-button">导入反馈继续<input id="importJson" type="file" accept="application/json,.json" /></label>
        </div>
        <p>尺度和题库分级不用现在额外操作，我会结合你的 Yes / No 和评价继续追问、迭代。</p>
      </div>
    </details>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./question-review.js"></script>
</body>
</html>
